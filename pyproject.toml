[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61.0", "wheel>=0.37.1"]


[project]
name = "envy"
version = "3.0.0"
description = "Envy is a scalable distributed rendering tool built for LAN environments."
readme = "README.md"
requires-python = ">=3.9,<4.0"
authors = [
    {name = "Nathan Vandevoort", email = "Nathan.v.2021@gmail.com"},
]

dependencies = [
    "pydantic>=2,<3",
]

[project.scripts]
# Command line interface entrypoint scripts
acme = "envy.__main__:client"

[project.urls]
"Homepage" = "<url>"
"Documentation" = "<url>"

[project.optional-dependencies]
dev = [
    "isort",
    "black",
]


[tool.setuptools]
# https://setuptools.pypa.io/en/latest/userguide/pyproject_config.html
platforms = ["Linux", "Windows"]
include-package-data = true
zip-safe = true  # This just means it's safe to zip up the bdist

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
known_first_party = ["acme"]
# If you need to exclude files from having their imports sorted
extend_skip_glob  = [
    "acme/somefile.py",
    "acme/somedir/*",
]

